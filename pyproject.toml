[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-classification-ml-vs-ann"
version = "1.0.0"
description = "Observed weather classification for Moroccan cities with Logistic Regression and a Keras ANN"
requires-python = ">=3.10,<3.14"
dependencies = [
	"numpy>=1.24,<3",
	"pandas>=2.0,<3",
	"requests>=2.31,<3",
	"scikit-learn>=1.3,<2",
	"matplotlib>=3.7,<4",
	"seaborn>=0.12,<1",
]

[project.optional-dependencies]
ann = ["tensorflow>=2.15,<3"]
dev = ["pytest>=7.4,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]